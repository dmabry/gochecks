run:
  timeout: 5m

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - deadcode
        - flag
        - funlen
        - lll
        - scopelint

linters:
  enable:
    - errcheck
    - gofmt
    - golint
    - ineffassign
    - noctx
    - staticcheck
    - unused
    - vet

linters-settings:
  errcheck:
    exclude: "^(Error|Close|Stop|Create|New|RawResult|SendResult|SetResult)\\w*\\.?\\("
