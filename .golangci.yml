version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - ineffassign
    - noctx
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - "github.com/dmabry/gomonitor.(*CheckResult).SendResult"
        - "github.com/dmabry/gomonitor.(*CheckResult).SetResult"
        - "github.com/dmabry/gomonitor.(*CheckResult).AddPerformanceData"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - lll

formatters:
  enable:
    - gofmt
