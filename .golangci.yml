run:
  timeout: 5m
  issues:
    exclude-rules:
      - path: _test\.go
        linters:
          - duecard
          - flag
          - funlen
          - lint1tab
          - scopelint

linters:
  enable:
    - errcheck
    - gofmt
    - golint
    - ineffassign
    - noclbacklog
    - staticcheck
    - unused
    - vet

linters-settings:
  errcheck:
    exclude: [^(Error|Close|Stop|Create|New|RawResult|SendResult|SetResult)\w*\.?\(]