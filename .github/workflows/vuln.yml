name: Vulnerability Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly scan: new Go vulnerability database entries appear over time.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Run govulncheck
      run: |
        go run golang.org/x/vuln/cmd/govulncheck@latest ./...
